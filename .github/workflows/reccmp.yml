name: reccmp

# Builds the decomp with the original VC6 toolchain (Wine, in the docker/ image)
# and reports per-function accuracy against the retail AlienShooter.exe.
#
# The original binary is never committed. Provide it to CI via a secret download
# URL (ORIGINAL_URL); reccmp-project.yml's sha256 verifies the right file.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reccmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce source comment policy
        run: python3 tools/check_source_comments.py

      - name: Build the toolchain image
        run: docker build -t alien-vc6 reccmp/

      - name: Fetch the original for comparison
        env:
          ORIGINAL_URL: ${{ secrets.ORIGINAL_URL }}
        run: |
          mkdir -p original
          curl -fsSL "$ORIGINAL_URL" -o original/AlienShooter.exe

      - name: Build + compare
        run: |
          mkdir -p build
          docker run --rm \
            -v "$PWD:/source" \
            -v "$PWD/build:/build" \
            -v "$PWD/original:/original:ro" \
            alien-vc6 -- \
            reccmp-reccmp --target ALIEN \
              --json /source/reccmp-report.json \
              --svg /source/reccmp-progress.svg \
              --silent

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: reccmp-report
          path: |
            reccmp-report.json
            reccmp-progress.svg
